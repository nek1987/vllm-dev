version: "3.9"
services:
  qwen3-8b:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN}
    image: qwen3-8b:v0.8.6-dev
    runtime: nvidia                 # важно оставить
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia            # ← не обязательно, но читаемо
              count: 'all'              # или "all"
              capabilities: ["gpu"]     # ← ОБЯЗАТЕЛЬНО
    command: >
      --model Qwen/Qwen3-8B
      --dtype float16
      --tensor-parallel-size 1
      --enable-chunked-prefill False
      --max-model-len 32768
      --port 5080
    environment:
      - HF_TOKEN=${HF_TOKEN}
    shm_size: "16g"
    volumes:
      - models:/root/.cache/huggingface
    ports:
      - "5080:5080"

volumes:
  models:
