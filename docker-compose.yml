version: "3.9"
services:
  qwen3-8b:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN}
    image: qwen3-8b:v0.8.6-dev
    runtime: nvidia                 # важно оставить
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia        # ← не обязательно, но читаемо
              count: 1              # или "all"
              capabilities: ["gpu"] # ← ОБЯЗАТЕЛЬНО
              device_ids: ["0"]     # ← можно убрать, если count: 1
    command: >
      --model Qwen/Qwen3-8B
      --dtype float16
      --tensor-parallel-size 1
      --enable-chunked-prefill False
      --max-model-len 32768
      --port 8000
    environment:
      - HF_TOKEN=${HF_TOKEN}
    shm_size: "16g"
    volumes:
      - models:/root/.cache/huggingface
    ports:
      - "8000:8000"

volumes:
  models:
