services:
  qwen3-8b:
    image: vllm/vllm-openai:v0.8.5      # или :latest
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: ["gpu"]
    command: >
      --model Qwen/Qwen3-8B
      --dtype float16
      --enable-chunked-prefill False 
      --max-model-len 32768
      --port 5080
    environment:
      - HF_TOKEN=${HF_TOKEN}
    shm_size: "16g"
    volumes:
      - models:/root/.cache/huggingface
    ports: ["5080:5080"]
volumes: {models: }
